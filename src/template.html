<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
  </head>
  <body>
    <div class="app">
      <!-- sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <svg
            class="sidebar-logo"
            viewBox="0 0 32 32"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle cx="16" cy="16" r="14" fill="#0A4174" />
            <circle cx="13" cy="13" r="4" fill="#FDB813" />
            <path
              d="M10 20a4 4 0 0 1 4-4h6a4 4 0 0 1 0 8h-6a4 4 0 0 1-4-4z"
              fill="#7BBDE8"
            />
            <path
              d="M18 22a3 3 0 0 1 3-3h1a3 3 0 0 1 0 6h-1a3 3 0 0 1-3-3z"
              fill="#BDD8E9"
            />
          </svg>
        </div>

        <nav aria-label="Main navigation">
          <ul class="nav-list">
            <li>
              <a
                href="#weather"
                data-route="weather"
                class="nav-link is-active"
              >
                <svg
                  class="nav-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8 6 6 0 0 0-11.5 1.6A4 4 0 0 0 6 19h11.5z"
                  />
                </svg>
                <span>Weather</span>
              </a>
            </li>
            <li>
              <a href="#settings" data-route="settings" class="nav-link">
                <svg
                  class="nav-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="3" />
                  <path
                    d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
                  />
                </svg>
                <span>Settings</span>
              </a>
            </li>
          </ul>
        </nav>
        <a
          class="sidebar-footer"
          href="https://github.com/w3nc/Project-Weather-App-The-Odin-Project"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View source on GitHub"
        >
          <svg
            viewBox="0 0 24 24"
            fill="currentColor"
            width="22"
            height="22"
            aria-hidden="true"
          >
            <path
              d="M12 .5C5.73.5.75 5.48.75 11.75c0 4.94 3.2 9.13 7.64 10.61.56.1.77-.24.77-.54v-2.1c-3.11.67-3.77-1.31-3.77-1.31-.5-1.29-1.24-1.63-1.24-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1 1.7 1.3 2.5.87.08-.71.39-1.19.71-1.47-2.48-.28-5.09-1.24-5.09-5.5 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.1-2.96 0 0 .93-.3 3.06 1.14a10.6 10.6 0 0 1 5.57 0c2.13-1.44 3.06-1.14 3.06-1.14.6 1.54.22 2.68.11 2.96.71.78 1.15 1.77 1.15 2.99 0 4.27-2.62 5.22-5.11 5.49.4.35.76 1.03.76 2.08v3.08c0 .3.2.65.77.54 4.44-1.48 7.64-5.67 7.64-10.61C23.25 5.48 18.27.5 12 .5z"
            />
          </svg>
        </a>
      </aside>

      <!-- main column -->
      <div class="main">
        
        <header class="topbar"></header>

        <!-- main content -->
        <main id="view" class="content" aria-live="polite"></main>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f6f3ec"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1a1814"
      media="(prefers-color-scheme: dark)"
    />
    <title>Todo List</title>
    <script>
      // prevent flash of wrong theme, runs before paint
      (function () {
        try {
          var stored = localStorage.getItem("odin-todo-app-theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var theme = stored || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>

      <!-- sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="user-profile">
            <img class="avatar" src="images/pinkman.jpg" alt="pinkman" />
            <div class="user-meta">
              <span class="username">Jesse Pinkman</span>
              <span class="user-subtitle">Personal</span>
            </div>
          </div>
          <div class="sidebar-actions">
            <button
              class="icon-btn theme-toggle-btn"
              type="button"
              data-theme-toggle
              aria-label="Toggle theme"
            >
              <svg class="icon icon-sun" aria-hidden="true">
                <use href="#icon-sun"></use>
              </svg>
              <svg class="icon icon-moon" aria-hidden="true">
                <use href="#icon-moon"></use>
              </svg>
            </button>
            <button
              class="icon-btn collapse-btn"
              type="button"
              id="collapse-sidebar-btn"
              aria-label="Collapse sidebar"
            >
              <svg class="icon" aria-hidden="true">
                <use href="#icon-chevron-left"></use>
              </svg>
            </button>
          </div>
        </div>

        <nav class="sidebar-nav">
          <ul class="nav-list primary-nav">
            <li>
              <button
                class="nav-item add-task-trigger"
                type="button"
                data-action="add-task-global"
                aria-label="Add new task"
              >
                <span class="nav-icon-wrap">
                  <svg class="icon" aria-hidden="true">
                    <use href="#icon-plus"></use>
                  </svg>
                </span>
                <span class="nav-label">Add task</span>
              </button>
            </li>
            <li>
              <button
                class="nav-item"
                type="button"
                data-view="search"
                aria-label="Search tasks"
              >
                <span class="nav-icon-wrap">
                  <svg class="icon" aria-hidden="true">
                    <use href="#icon-search"></use>
                  </svg>
                </span>
                <span class="nav-label">Search</span>
              </button>
            </li>
            <li>
              <button
                class="nav-item"
                type="button"
                data-view="inbox"
                aria-label="Inbox"
              >
                <span class="nav-icon-wrap">
                  <svg class="icon" aria-hidden="true">
                    <use href="#icon-inbox"></use>
                  </svg>
                </span>
                <span class="nav-label">Inbox</span>
                <span class="nav-badge" data-badge="inbox" hidden>0</span>
              </button>
            </li>
            <li>
              <button
                class="nav-item"
                type="button"
                data-view="all"
                aria-label="All tasks"
              >
                <span class="nav-icon-wrap">
                  <svg class="icon" aria-hidden="true">
                    <use href="#icon-layers"></use>
                  </svg>
                </span>
                <span class="nav-label">All Tasks</span>
                <span class="nav-badge" data-badge="all" hidden>0</span>
              </button>
            </li>
            <li>
              <button
                class="nav-item"
                type="button"
                data-view="today"
                aria-label="Today"
              >
                <span class="nav-icon-wrap">
                  <svg class="icon" aria-hidden="true">
                    <use href="#icon-calendar-today"></use>
                  </svg>
                </span>
                <span class="nav-label">Today</span>
                <span class="nav-badge" data-badge="today" hidden>0</span>
              </button>
            </li>
            <li>
              <button
                class="nav-item"
                type="button"
                data-view="upcoming"
                aria-label="Upcoming"
              >
                <span class="nav-icon-wrap">
                  <svg class="icon" aria-hidden="true">
                    <use href="#icon-calendar-upcoming"></use>
                  </svg>
                </span>
                <span class="nav-label">Upcoming</span>
                <span class="nav-badge" data-badge="upcoming" hidden>0</span>
              </button>
            </li>
          </ul>

          <div class="nav-section-header">
            <span>My Projects</span>
            <button
              class="add-project-btn"
              type="button"
              aria-label="Add new project"
            >
              <svg class="icon" aria-hidden="true">
                <use href="#icon-plus"></use>
              </svg>
            </button>
          </div>

          <ul class="nav-list project-nav" id="project-list-container"></ul>
          <p class="empty-projects-hint" id="empty-projects-hint">
            No projects yet — hit <strong>+</strong> to create one.
          </p>
        </nav>
      </aside>

      <!-- main content -->
      <main class="main-content">
        <header class="mobile-topbar">
          <button
            class="icon-btn"
            type="button"
            id="mobile-menu-btn"
            aria-label="Open menu"
          >
            <svg class="icon" aria-hidden="true">
              <use href="#icon-menu"></use>
            </svg>
          </button>
          <span class="mobile-title">Tasks</span>
          <button
            class="icon-btn theme-toggle-btn"
            type="button"
            data-theme-toggle
            aria-label="Toggle theme"
          >
            <svg class="icon icon-sun" aria-hidden="true">
              <use href="#icon-sun"></use>
            </svg>
            <svg class="icon icon-moon" aria-hidden="true">
              <use href="#icon-moon"></use>
            </svg>
          </button>
        </header>
        <section class="content-view"></section>
      </main>
    </div>

    <!--  modals -->
    <div id="task-modal" class="modal-overlay" style="display: none">
      <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <header class="modal-header">
          <div class="modal-header-text">
            <h2 id="modal-title">Add New Task</h2>
            <p class="modal-subtitle" id="modal-subtitle">
              Capture what needs doing.
            </p>
          </div>
          <button class="modal-close" type="button" aria-label="Close modal">
            <svg class="icon" aria-hidden="true">
              <use href="#icon-close"></use>
            </svg>
          </button>
        </header>

        <form id="task-form" class="task-form">
          <input type="hidden" id="task-id" />
          <input type="hidden" id="project-id" />

          <div class="form-group" id="project-chooser" style="display: none">
            <label for="project-select">Add to project</label>
            <select id="project-select"></select>
          </div>

          <div class="form-group">
            <label for="task-title">Title <span class="req">*</span></label>
            <input
              type="text"
              id="task-title"
              required
              placeholder="What needs to be done?"
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="task-description">Description</label>
            <textarea
              id="task-description"
              rows="3"
              placeholder="Add details..."
            ></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="task-due-date">Due Date</label>
              <input type="date" id="task-due-date" />
            </div>

            <div class="form-group">
              <label for="task-priority">Priority</label>
              <select id="task-priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="task-notes">Notes</label>
            <textarea
              id="task-notes"
              rows="2"
              placeholder="Additional notes..."
            ></textarea>
          </div>

          <div class="checklist-field">
            <div class="checklist-header">
              <label>Checklist</label>
              <span class="checklist-count" id="checklist-count">0</span>
            </div>
            <ul class="checklist-editor" id="checklist-editor"></ul>
            <div class="checklist-add-row">
              <input
                type="text"
                id="checklist-input"
                placeholder="Add an item…"
                autocomplete="off"
              />
              <button
                type="button"
                class="btn btn-submit checklist-add-btn"
                id="checklist-add-btn"
                aria-label="Add checklist item"
              >
                <svg class="icon" aria-hidden="true">
                  <use href="#icon-plus"></use>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-cancel">Cancel</button>
            <button type="submit" class="btn btn-submit">Save Task</button>
          </div>
        </form>
      </div>
    </div>

    <div
      id="confirm-modal"
      class="modal-overlay"
      style="display: none"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
    >
      <div class="modal-content modal-sm">
        <header class="modal-header">
          <div class="modal-header-text">
            <h2 id="confirm-title">Are you sure?</h2>
          </div>
          <button
            class="modal-close"
            type="button"
            aria-label="Close"
            data-confirm-close
          >
            <svg class="icon" aria-hidden="true">
              <use href="#icon-close"></use>
            </svg>
          </button>
        </header>
        <div class="confirm-body"><p id="confirm-message"></p></div>
        <div class="form-actions">
          <button type="button" class="btn btn-cancel" id="confirm-cancel">
            Cancel
          </button>
          <button type="button" class="btn btn-danger" id="confirm-ok">
            Delete
          </button>
        </div>
      </div>
    </div>

    <div
      id="project-modal"
      class="modal-overlay"
      style="display: none"
      role="dialog"
      aria-modal="true"
      aria-labelledby="project-modal-title"
    >
      <div class="modal-content modal-sm">
        <header class="modal-header">
          <div class="modal-header-text">
            <h2 id="project-modal-title">New Project</h2>
            <p class="modal-subtitle">Group related tasks together.</p>
          </div>
          <button class="modal-close" type="button" aria-label="Close">
            <svg class="icon" aria-hidden="true">
              <use href="#icon-close"></use>
            </svg>
          </button>
        </header>
        <div class="confirm-body">
          <div class="form-group">
            <label for="project-name"
              >Project name <span class="req">*</span></label
            >
            <input
              type="text"
              id="project-name"
              placeholder="e.g. Gym, Shopping…"
            />
            <span class="field-error" id="project-error"></span>
          </div>
          <div class="form-group">
            <label for="project-desc">Description (optional)</label>
            <textarea
              id="project-desc"
              rows="2"
              placeholder="What's this project for?"
            ></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-cancel">Cancel</button>
          <button type="button" class="btn btn-submit">Create project</button>
        </div>
      </div>
    </div>

    <!-- svg sprite -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path
          d="M19 11h-6V5a1 1 0 1 0-2 0v6H5a1 1 0 1 0 0 2h6v6a1 1 0 1 0 2 0v-6h6a1 1 0 1 0 0-2z"
        />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <path
          d="M10.5 3a7.5 7.5 0 1 0 4.55 13.47l4.24 4.24a1 1 0 1 0 1.42-1.42l-4.24-4.24A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"
        />
      </symbol>
      <symbol id="icon-inbox" viewBox="0 0 24 24">
        <path
          d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v7h4a3 3 0 0 0 6 0h4V6H5zm0 9v3h14v-3h-3.4a5 5 0 0 1-7.2 0H5z"
        />
      </symbol>
      <symbol id="icon-calendar-today" viewBox="0 0 24 24">
        <path
          d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1zM5 9v10h14V9H5zm3 3h4v4H8v-4z"
        />
      </symbol>
      <symbol id="icon-calendar-upcoming" viewBox="0 0 24 24">
        <path
          d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1zM5 9v10h14V9H5z"
        />
      </symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24">
        <path
          d="M14.7 5.3a1 1 0 0 1 0 1.4L9.4 12l5.3 5.3a1 1 0 1 1-1.4 1.4l-6-6a1 1 0 0 1 0-1.4l6-6a1 1 0 0 1 1.4 0z"
        />
      </symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24">
        <path
          d="M4 6h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2zm0 5h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2zm0 5h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2z"
        />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path
          d="M6.4 5A1 1 0 0 1 7.8 5L12 9.2 16.2 5a1 1 0 1 1 1.4 1.4L13.4 10.6 17.6 14.8a1 1 0 0 1-1.4 1.4L12 12l-4.2 4.2a1 1 0 0 1-1.4-1.4l4.2-4.2L6.4 6.4A1 1 0 0 1 6.4 5z"
        />
      </symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24">
        <path
          d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-13a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V5a1 1 0 0 1 1-1zm0 15a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1zM4 12a1 1 0 0 1 1-1h1a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1zm14 0a1 1 0 0 1 1-1h1a1 1 0 1 1 0 2h-1a1 1 0 0 1-1-1zM5.64 5.64a1 1 0 0 1 1.42 0l.7.71A1 1 0 0 1 6.35 7.76l-.71-.7a1 1 0 0 1 0-1.42zm11.3 11.3a1 1 0 0 1 1.42 0l.7.71a1 1 0 0 1-1.4 1.41l-.72-.7a1 1 0 0 1 0-1.42zM18.36 5.64a1 1 0 0 1 0 1.42l-.7.7a1 1 0 0 1-1.42-1.4l.71-.72a1 1 0 0 1 1.41 0zM7.05 16.95a1 1 0 0 1 0 1.41l-.7.71a1 1 0 0 1-1.42-1.41l.71-.71a1 1 0 0 1 1.41 0z"
        />
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24">
        <path
          d="M21 12.8A9 9 0 1 1 11.2 3a1 1 0 0 1 1.3 1.2 7 7 0 0 0 8.3 8.3 1 1 0 0 1 1.2 1.3z"
        />
      </symbol>
      <symbol id="icon-layers" viewBox="0 0 24 24">
        <path
          d="M4 6h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2zm0 5h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2zm0 5h10a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2z"
        />
      </symbol>
      <symbol id="icon-checklist" viewBox="0 0 24 24">
        <path
          d="M3 6h2v2H3zM3 11h2v2H3zM3 16h2v2H3zM8 6h13v2H8zM8 11h13v2H8zM8 16h13v2H8z"
        />
      </symbol>
      <symbol id="icon-grip" viewBox="0 0 24 24">
        <path
          d="M9 5.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm6 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-6 5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm6 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-6 5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm6 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"
        />
      </symbol>
    </svg>
  </body>
</html>
